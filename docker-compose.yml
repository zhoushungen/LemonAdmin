services:
  mysql:
    image: mysql:8.4
    container_name: lemon-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_dev_password
      MYSQL_DATABASE: lemon
      MYSQL_USER: lemon
      MYSQL_PASSWORD: lemon_dev_password
      TZ: Asia/Shanghai
    ports: ["3306:3306"]
    volumes: ["mysql-data:/var/lib/mysql"]
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ulemon", "-plemon_dev_password"]
      interval: 10s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7.2-alpine
    container_name: lemon-redis
    restart: unless-stopped
    ports: ["6379:6379"]
    volumes: ["redis-data:/data"]
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20
  api:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
    container_name: lemon-api
    restart: unless-stopped
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
    ports: ["5080:8080"]
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__MySql: Server=mysql;Port=3306;Database=lemon;User ID=lemon;Password=lemon_dev_password;CharSet=utf8mb4;SslMode=None;Allow User Variables=true;
      Redis__ConnectionString: redis:6379,abortConnect=false
      Jwt__Secret: PLEASE_CHANGE_THIS_32_BYTE_MINIMUM_SECRET_2026
      BootstrapAdmin__Password: ChangeMe_123456
    volumes:
      - ./runtime/logs:/app/logs
      - ./runtime/uploads:/app/uploads
  ui:
    build: ./lemon-ui
    container_name: lemon-ui
    restart: unless-stopped
    depends_on: [api]
    ports: ["5173:80"]
volumes:
  mysql-data:
  redis-data:
